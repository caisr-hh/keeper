[project]
site_name = "KEEPER"
site_url = "https://caisr-hh.github.io/keeper/"
site_description = "Industrial AI research for efficient and predictable operations at Halmstad University."
repo_url = "https://github.com/caisr-hh/keeper"
nav = [
    { "Home" = "index.md" },
    { "People" = "people.md" },
    { "Projects" = [
        "projects/index.md",
        { "AI-MARiE" = "projects/ai-marie.md" },
        { "AIM-FLIX" = "projects/aim-flix.md" },
        { "FREEWAY" = "projects/freeway.md" },
        { "LEAD-AI" = "projects/lead-ai.md" },
        { "PRIDE" = "projects/pride.md" },
        { "UNIFY-AI" = "projects/unify-ai.md" },
    ] },
    { "Publications" = "publications.md" },
    { "Partners" = "partners.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
features = ["navigation.tabs", "navigation.indexes"]
palette.scheme = "default"
palette.primary = "custom"
palette.accent = "custom"
font.text = "Open Sans"
logo = "images/keeper-logo-gradient.svg"
favicon = "images/keeper-logo-gradient.png"
